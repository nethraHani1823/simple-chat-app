name: Docker Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # Job 1: secret scanning — runs first, blocks everything else
  # ---------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Gitleaks needs all commits, not just the latest

      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:latest \
            git /repo --redact --verbose --no-banner

  # ---------------------------------------------------------------
  # Job 2: build, scan, push
  # ---------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ---- pre-build checks: source only, fail fast ----
      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'          # report only for now

      - name: Trivy — dependency vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'          # report only for now

      # ---- build ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

