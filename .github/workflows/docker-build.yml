name: Docker Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # Job 1: secret scanning — runs first, blocks everything else
  # ---------------------------------------------------------------
  # secret-scan:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - name: Checkout code (full history)
  #       uses: actions/checkout@v6
  #       with:
  #         fetch-depth: 0   # Gitleaks needs all commits, not just the latest

  #     - name: Gitleaks secret scan
  #       run: |
  #         docker run --rm -v "$PWD:/repo" \
  #           -e GIT_CONFIG_COUNT=1 \
  #           -e GIT_CONFIG_KEY_0=safe.directory \
  #           -e GIT_CONFIG_VALUE_0=/repo \
  #           zricethezav/gitleaks:latest \
  #           git /repo --redact --verbose --no-banner

  # ---------------------------------------------------------------
  # Job 2: unit tests + coverage report
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    # needs: secret-scan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70

      - name: Publish coverage summary
        id: coverage-summary
        if: always()
        run: |
          REPORT="$(python -m coverage report)"

          {
            echo "## Coverage report"
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "body<<COVERAGE_EOF"
            echo "## Coverage report"
            echo '```'
            echo "$REPORT"
            echo '```'
            echo "COVERAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.coverage-summary.outputs.body }}
          reactions: rocket

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # ---------------------------------------------------------------
  # Job 3: build, scan, push
  # ---------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    # needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ---- pre-build checks: source only, fail fast ----
      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — dependency vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # ---- build ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t chatflow:test .

      # ---- post-build, pre-push ----
      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: chatflow:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name test chatflow:test
          sleep 5
          docker ps | grep test
          curl -f http://localhost:5000 || exit 1
          docker logs test
          docker stop test

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
